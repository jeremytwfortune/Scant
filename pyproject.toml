[project]
name = "scant"
version = "0.1.0"
description = ""
readme = "readme.md"
authors = [{ name = "Jeremy Fortune", email = "jeremytwfortune@gmail.com" }]
requires-python = ">=3.14,<4.0"
dependencies = [
    "boto3>=1.34.95,<2.0.0",
    "playwright>=1.64.1,<2.0.0",
    "requests>=2.31.0,<3.0.0",
]

[dependency-groups]
dev = [
    "black>=26.10.1,<27.0.0",
    "ipykernel>=6.29.4,<7.0.0",
    "mypy>=1.20.2,<2.0.0",
    "types-boto3>=1.0.2,<2.0.0",
    "types-requests>=2.31.0.20240406,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
]
deploy = ["awslambdaric>=4.2.3,<5.0.0"]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
namespace = true

[tool.black]
line-length = 120
